{{- if partial "helpers/is-modern-page.html" .Page -}}
{{- $src := partial "helpers/get-page-resource-url.html" (dict "page" .Page "url" (.Get "src")) -}}
<img class="modern-image" src="{{ $src }}" alt="{{ .Get "alt" | default (.Get "title") | default "" }}" loading="lazy"
  {{ with .Get "width" }}width="{{ . }}"{{ end }} {{ with .Get "height" }}height="{{ . }}"{{ end }}
  {{ with .Get "align" }}data-align="{{ . }}"{{ end }} {{ with .Get "float" }}data-float="{{ . }}"{{ end }}>
{{- else -}}
{{- $src := partial "helpers/get-resource-url.html" (.Get "src") -}}
<img src="{{ $src }}"
    {{ if .Get "title"}}
        alt="{{.Get "title"}}"
    {{end}}
    {{ if .Get "width"}}
        width="{{.Get "width"}}"
    {{end}}
    {{ if .Get "height"}}
        height="{{.Get "height"}}"
    {{end}}
    {{ if .Get "float"}}
        style="float: {{.Get "float"}};"
    {{end}}
    {{ if .Get "align"}}
        class="{{.Get "align"}}"
    {{end}}
>

{{- end -}}
