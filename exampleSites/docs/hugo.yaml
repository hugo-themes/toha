baseURL: https://example.org/
title: Toha Docs
locale: en-us
defaultContentLanguage: en
languages:
  en:
    label: English
    locale: en-US
    weight: 1
  fr:
    label: Français
    locale: fr-FR
    weight: 2
  es:
    label: Español
    locale: es-ES
    weight: 3
enableEmoji: true
enableRobotsTXT: true
disableKinds: [taxonomy, term]
# This standalone example excludes the theme’s legacy blog/search scaffolding.
# Remove this filter when composing docs with the existing blog.
ignoreFiles: ['/content/(posts|search)/']

module:
  imports:
    - path: github.com/hugo-toha/toha/v4
  mounts:
    - source: assets
      target: assets
    - source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
      disableWatch: true

build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: css

security:
  exec:
    allow: ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  description: Guides, configuration, and shared components for the Toha Hugo theme.
  home:
    layout: docs
  features:
    embedpdf:
      enable: true
    math:
      enable: true
    flowchart:
      enable: true
    docs:
      enable: true
      section: docs
      sidebar:
        groupSections: true
      toc:
        scrollSpy: true
      search:
        enable: true
      edit:
        enable: true
        baseURL: https://github.com/hugo-themes/toha/edit/main/exampleSites/docs/content/
