baseURL: https://example.org/
title: Toha Docs
locale: en-us
defaultContentLanguage: en
enableRobotsTXT: true
disableKinds: [taxonomy, term]
# This standalone example excludes the theme’s legacy blog/search scaffolding.
# Remove this filter when composing docs with the existing blog.
ignoreFiles: ['/content/(posts|search)/']

module:
  imports:
    - path: github.com/hugo-toha/toha/v4
  mounts:
    - source: assets
      target: assets
    - source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
      disableWatch: true

build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: css

security:
  exec:
    allow: ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

markup:
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  description: A shared component foundation for every Toha layout.
  home:
    layout: docs
  features:
    docs:
      enable: true
      section: docs
