baseURL: https://example.org/
title: Toha Blog
locale: en-us
defaultContentLanguage: en
enableRobotsTXT: true

module:
  imports:
    - path: github.com/hugo-toha/toha/v4
  mounts:
    - source: assets
      target: assets
    - source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
      disableWatch: true

build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: css

security:
  exec:
    allow: ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

outputs:
  home: [HTML, RSS, JSON]

taxonomies:
  category: categories
  tag: tags
  series: series

markup:
  highlight:
    noClasses: false

params:
  description: Blog on building with Toha.
  author:
    name: Toha contributors
  home:
    layout: blog
    blog:
      postsPerPage: 3
      hero:
        image: images/default-background.jpg
      topics:
        taxonomy: categories
        limit: 4
        postsPerTopic: 3
  features:
    componentsDesign:
      enable: true
    blog:
      enable: true
      section: posts
      archive:
        enable: true
      post:
        enable: true
      search:
        enable: true
    theme:
      enable: true
    toc:
      enable: true
    codeBlock:
      copyButton:
        enable: true
    tags:
      enable: true
      on_card: true
    pagination:
      maxPostsPerPage: 4
    structuredData:
      enable: true

# Homepage selection does not change publication. Docs or notes can be added
# independently; see docs/layouts.md for mixed-layout configuration.
