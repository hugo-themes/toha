name: Label Enforcer

# Run action on pull request creation, reopening, or label changes
on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled]

jobs:
  # Ensure that PR has desired labels
  enforce-label:
    runs-on: ubuntu-latest
    steps:
      - uses: mheap/github-action-required-labels@v5.6.0
        with:
          mode: minimum
          count: 1
          labels: |
            feature
            fix
            maintenance
          message: "The PR must have at least one of these labels: ['feature','fix','maintenance']"
