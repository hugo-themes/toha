# Your Skills.
# Give a summary of you each skill in the summary section.
skills:
- name: Kubernetes
  logo: /images/sections/skills/kubernetes.png
  summary: "Capable of deploying, managing application on Kubernetes. Experienced in writing Kubernetes controllers for CRDs."
  categories: ["container"]
  url: "https://kubernetes.io/"

- name: Go Development
  logo: /images/sections/skills/go.png
  summary: "Using as the main language for professional development. Capable of writing scalable, testable, and maintainable program."
  categories: ["basic", "language"]
  url: "https://golang.org/"

- name: Cloud Computing
  logo: /images/sections/skills/cloud.png
  summary: "Worked with most of the major clouds such as GCP, AWS, Azure etc."
  categories: ["others"]
  # Optional text-only details. Omit this block to keep the existing card.
  details:
    summary: "I design reliable cloud services, automate infrastructure, and help teams operate what they build."
    items:
    - name: AWS
      summary: "Production infrastructure and application delivery."
      items:
      - name: Compute and scaling
        summary: "Operating EC2 fleets and planning capacity."
        items:
        - name: Auto Scaling
          summary: "Scaling capacity with demand and replacing unhealthy instances."
          items:
          - name: Launch templates and instance refresh
            summary: "Rolling out configuration changes across application fleets."
        - name: Spot instances
          summary: "Using interruptible capacity for fault-tolerant jobs."
      - name: Serverless
        summary: "Building event-driven services with Lambda and API Gateway."
      - name: Infrastructure as code
        summary: "Creating reviewable, repeatable environments with [Terraform](https://www.terraform.io/)."
    - name: Microsoft Azure
      summary: "Deploying applications and managed databases."
      items:
      - name: App Service
        summary: "Deploying Go and Python services as managed applications."
      - name: Managed databases
        items:
        - name: PostgreSQL
        - name: MySQL
    - name: Google Cloud
      summary: "Integrating cloud APIs into applications."

- name: Docker
  logo: /images/sections/skills/docker.svg
  summary: "Write most of the programs as dockerized container. Experienced with multi-stage, multi-arch build process."
  categories: ["container"]
  url: "https://www.docker.com/"

- name: Prometheus
  logo: /images/sections/skills/prometheus.png
  summary: "Capable of setup, configure Prometheus metrics. Experienced with PromQL, AlertManager. Also, experienced with writing metric exporters."
  categories: ["basic"]
  url: "https://prometheus.io/"

- name: Linux
  logo: /images/sections/skills/linux.png
  summary: "Using as the main operating system. Capable of writing bash/shell scripts."
  categories: ["others"]

- name: Git
  logo: /images/sections/skills/git.png
  summary: "Experienced with git-based development. Mostly, use Github. Also, have experience in working with GitLab."
  categories: ["basic"]
  url: "https://git-scm.com/"

- name: C++
  logo: /images/sections/skills/c++.png
  summary: "Know basic C/C++ programming. Used for contest programming and problem solving."
  categories: ["basic", "language"]
