[tools]
hugo-extended = '0.169.0'
node = 'latest'
go = 'latest'

[tasks.install]
description = "Install root project dependencies"
run = "npm install"

[tasks.update]
description = "Update node dependencies and regenerate Hugo modules"
# AI Note: This is a destructive action (rm file). Good to keep, but Agents should rely on 'install' mostly.
run = ["npm update", "rm package.hugo.json", "hugo mod npm pack"]

[tasks.install-portfolio-deps]
description = "Install portfolio example dependencies (including Hugo modules)"
depends = ["install"]
dir = "exampleSites/portfolio"
run = ["hugo mod tidy", "hugo mod npm pack", "npm install"]

[tasks.install-example-deps]
description = "Install dependencies for all example sites"
depends = ["install-portfolio-deps", "install-docs-deps"]

[tasks.install-docs-deps]
description = "Install docs example dependencies (including Hugo modules)"
depends = ["install"]
dir = "exampleSites/docs"
run = ["hugo mod tidy", "hugo mod npm pack", "npm install"]

[tasks.build-docs]
description = "Build the docs example for production"
depends = ["install-docs-deps"]
dir = "exampleSites/docs"
run = "hugo --gc --minify --cleanDestinationDir"

[tasks.docs]
description = "Start the docs development server with live reload"
depends = ["install-docs-deps"]
dir = "exampleSites/docs"
run = "hugo server -w --bind=0.0.0.0 --renderToMemory"

[tasks.test-docs]
description = "Verify modern docs, component contracts, and legacy asset isolation"
depends = ["install"]
run = "node --test tests/docs-layout.test.mjs"

[tasks.build-portfolio]
description = "Build the portfolio example for production"
depends = ["install-portfolio-deps"]
dir = "exampleSites/portfolio"
# Use --cleanDestinationDir so the agent doesn't get confused by old artifacts
run = ["hugo --gc --minify --cleanDestinationDir"]

[tasks.build]
description = "Build all example sites for production"
depends = ["build-portfolio", "build-docs"]

[tasks.lint]
description = "Run code linters"
depends = ["install"]
run = "npm run lint"

[tasks.test-urls]
description = "Verify page and resource URLs in multilingual Hugo builds"
run = "node --test tests/url-resolution.test.mjs"

[tasks.test-seo]
description = "Verify SEO metadata, structured data, and sitemap output"
run = "node --test tests/seo-metadata.test.mjs"

[tasks.test-pagination]
description = "Verify paginated archives and progressive post loading"
run = "node --test tests/pagination.test.mjs tests/lazy-load-posts.test.mjs"

[tasks.test-code-blocks]
description = "Verify code previews, configuration, and complete-source copying"
run = "node --test tests/code-block-panel.test.mjs"

[tasks.test-skill-details]
description = "Verify opt-in skill details, localization, and progressive dialog enhancement"
run = "node --test tests/skill-details.test.mjs"

[tasks.test-scroll-snap]
description = "Verify homepage scroll snapping is opt-in and isolated from other pages"
run = "node --test tests/scroll-snap.test.mjs"

[tasks.portfolio]
description = "Start the portfolio development server with live reload"
alias = ["example-portfolio", "example-site"]
depends = ["install-portfolio-deps"]
dir = "exampleSites/portfolio"
# Some AI cloud envs (like GitHub Codespaces or IDX) need this to expose the port.
run = "hugo server -w --bind=0.0.0.0"

[tasks.fix-security]
description = "Auto-fix npm security vulnerabilities"
run = "npm audit fix --force"


[tasks.check]
description = "Run build, lint, URL, and SEO regression tests"
# This gives the AI a single 'truth' command to validate its work.
depends = ["lint", "build", "test-urls", "test-seo", "test-pagination", "test-code-blocks", "test-skill-details", "test-scroll-snap", "test-docs"]
